name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish
        run: |
          dotnet publish src/ValheimPanel/ValheimPanel.csproj \
            -c Release -r linux-x64 \
            -o publish
          mv publish/ValheimPanel valheim-panel-linux-x64
          chmod +x valheim-panel-linux-x64

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: valheim-panel-linux-x64
          generate_release_notes: true
